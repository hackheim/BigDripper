; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; A plain `pio run` builds only the normal firmware. The preview envs at the
; bottom are built only when asked for with -e.
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Route Serial to the native USB port (the one marked USB). Without this the
; board default (ARDUINO_USB_MODE=1) leaves Serial on UART0 / GPIO43-44 and
; nothing is printed over native USB.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; log_e/w/i/d/v compile to nothing unless this is raised. 0=none 1=error
    ; 2=warn 3=info 4=debug 5=verbose. Serial.printf is unaffected.
    ; Release builds stay at 0: a log write blocks the calling task once the
    ; UART FIFO fills, which can stall the print engine between columns.
    ; Raise to 3 (info) to see the print engine's period_us/burst_us/overruns
    ; line on the bench.
    -D CORE_DEBUG_LEVEL=0

; Target the UART bridge (CP2102) explicitly rather than auto-detecting. Its COM
; port is independent of the ESP32's own reset/boot state, unlike the native USB
; port, so it stays available even after a crash or a bare EN/reset press.
; Update this if Windows ever assigns the CP2102 a different COM number.
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

upload_port = /dev/cu.usbserial-21410
monitor_port = /dev/cu.usbserial-21410


monitor_speed = 115200
; esp32_exception_decoder turns a crash backtrace into file:line.
; time prefixes every line with a host timestamp.
monitor_filters = esp32_exception_decoder, time

; NOTE: the CP2102 UART bridge (COM4) uses the standard RTS/DTR auto-reset
; circuit that esptool has always supported directly, so no reset workaround
; is needed here. scripts/enter_download_mode.py + before_reset=no_reset used
; to live here for the *native* USB port's soft-reset timing quirk; applying
; that same forced sequence to the CP2102 does not actually drop the chip into
; the ROM bootloader, so esptool ends up trying to sync against the running
; app's own serial output instead ("Invalid head of packet: serial noise").
; Re-add a similar workaround, scoped to the native port only, if you go back
; to flashing over native USB.

; --- Console preview (Ticket 7) ---------------------------------------------
;
; Bench check of what the head prints, without water: every column that
; fires is drawn as one line on the CP2102 port (Serial0, the cable used for
; flashing), 16 chars, '#' = valve open, '.' = closed, COIL1 on the left.
; Rotate the screen 90 degrees anticlockwise (left edge down) and the text
; reads the right way up. Context lines: "-- HELLO [Drip] --" when a message
; starts, "-- mode: lines --" on mode changes, "~~ skipped N ~~" when the
; wheel jumped columns, "!! dropped N lines" if the console fell behind.
; See README.md, "Console preview".
;
;   preview      console preview, valves fire as normal
;                  pio run -e preview -t upload -t monitor
;   preview-dry  console preview, valves never open (dry run)
;                  pio run -e preview-dry -t upload -t monitor
;
; Add --upload-port/--monitor-port if the CP2102 isn't at the port above.
; Flash the normal env (plain `pio run -t upload`) again before riding.
;
; The build flags behind them, usable on their own too:
;   -D CONSOLE_PREVIEW=1          the console preview
;   -D CONSOLE_PREVIEW_DRY_RUN=1  valves never open (banner at boot, DRY RUN
;                                 line on the web page)
;
; No "time" monitor filter here: a timestamp on every line would spoil the
; picture.

[env:preview]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D CONSOLE_PREVIEW=1
monitor_filters = esp32_exception_decoder

[env:preview-dry]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D CONSOLE_PREVIEW=1
    -D CONSOLE_PREVIEW_DRY_RUN=1
monitor_filters = esp32_exception_decoder
