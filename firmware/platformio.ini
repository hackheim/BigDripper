; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Route Serial to the native USB port (the one marked USB). Without this the
; board default (ARDUINO_USB_MODE=1) leaves Serial on UART0 / GPIO43-44 and
; nothing is printed over native USB.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; log_e/w/i/d/v compile to nothing unless this is raised. 0=none 1=error
    ; 2=warn 3=info 4=debug 5=verbose. Serial.printf is unaffected.
    -D CORE_DEBUG_LEVEL=4

monitor_speed = 115200
; esp32_exception_decoder turns a crash backtrace into file:line.
; time prefixes every line with a host timestamp.
monitor_filters = esp32_exception_decoder, time

; esptool's built-in USB-JTAG reset timings are too tight for this host, so the
; chip lands in SPI boot instead of download mode. The pre-upload script runs the
; same sequence with longer delays; no_reset then stops esptool from undoing it.
extra_scripts = pre:scripts/enter_download_mode.py
board_upload.before_reset = no_reset
